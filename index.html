<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compile Match Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-4">
    <div class="max-w-5xl mx-auto p-4 sm:p-6">
        <header class="text-center mb-8 border-b border-slate-800 pb-4 relative">
            <h1 class="text-3xl font-black tracking-wider text-amber-400">COMPILE MATCH TRACKER</h1>
            <p class="text-sm text-slate-400 mt-1">Hệ thống lưu trữ và thống kê dữ liệu trận đấu (Cloud Sync)</p>
            
            <div class="mt-3 flex justify-center items-center gap-2">
                <button onclick="syncDataFromCloud()" id="syncBtn" class="px-3 py-1 bg-sky-700 hover:bg-sky-600 text-white text-xs font-bold rounded shadow transition flex items-center gap-1">
                    🔄 Đồng bộ từ Cloud
                </button>
            </div>

            <div class="mt-4 flex flex-wrap justify-center gap-2">
                <button onclick="switchView('main')" id="btnMain" class="px-4 py-2 bg-emerald-600 text-white font-bold rounded-lg text-sm transition">Nhập trận đấu</button>
                <button onclick="switchView('rankings')" id="btnRankings" class="px-4 py-2 bg-slate-800 text-slate-300 font-bold rounded-lg text-sm transition hover:bg-slate-700">Hệ thống game</button>
                <button onclick="switchView('history')" id="btnHistory" class="px-4 py-2 bg-slate-800 text-slate-300 font-bold rounded-lg text-sm transition hover:bg-slate-700">Lịch sử đấu</button>
            </div>
        </header>

        <div id="viewMain" class="space-y-8">
            <section class="bg-slate-900 border border-slate-800 rounded-xl p-4 sm:p-6 shadow-xl">
                <h2 class="text-xl font-bold mb-4 text-emerald-400">NEW MATCH</h2>
                <div class="bg-slate-800/40 p-3 rounded-lg border border-slate-700/50 mb-6">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" id="enableBan" onchange="toggleBanMode()" class="w-4 h-4 text-emerald-600 rounded bg-slate-800 border-slate-700 focus:ring-emerald-500">
                        <span class="text-sm font-bold text-amber-300">Áp dụng luật Ban Protocol</span>
                    </label>
                </div>

                <div class="mb-6 bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <div class="flex justify-between items-center mb-3">
                        <h3 id="pickStageTitle" class="text-base font-bold text-amber-400">Giai đoạn: Chọn Protocol (P1: 0/3 | P2: 0/3)</h3>
                        <div id="banStatusContainer" class="hidden text-xs text-red-400 font-bold bg-red-950/40 px-2.5 py-1 rounded border border-red-900">
                            Đang chọn Ban: <span id="banCount">0</span> bị cấm
                        </div>
                    </div>
                    <div id="bannedDisplayArea" class="hidden mb-4 p-3 bg-red-950/20 border border-red-900/50 rounded-lg">
                        <p class="text-xs font-bold text-red-400 mb-2 uppercase tracking-wider">Protocol bị cấm (Banned):</p>
                        <div id="bannedCardsContainer" class="flex flex-wrap gap-2"></div>
                    </div>
                    <div id="protocolCardGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3"></div>
                    <div class="mt-4 text-center">
                        <button type="button" id="btnConfirmPick" onclick="confirmProtocolStage()" disabled class="px-6 py-2.5 bg-slate-700 text-slate-400 font-bold rounded-lg text-sm transition cursor-not-allowed">
                            Xác nhận Chọn Protocol
                        </button>
                    </div>
                </div>

                <form id="matchForm" class="hidden space-y-4 pt-4 border-t border-slate-800">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div id="p1Card" class="bg-slate-800/50 p-4 rounded-lg border border-slate-700/50 transition-all">
                            <label class="block text-xs uppercase text-emerald-400 font-bold mb-1">P1 (Đã pick 3 thẻ)</label>
                            <input type="text" id="p1Name" required placeholder="Tên Người chơi 1" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-emerald-500 mb-3">
                            <div id="p1PickedTags" class="flex flex-wrap gap-1 mb-4 text-xs text-emerald-300"></div>
                            <button type="button" onclick="setWinner('p1')" id="btnWinP1" class="w-full py-2 bg-slate-800 hover:bg-emerald-600 text-slate-300 font-bold rounded border border-slate-700 text-sm transition shadow">P1 WIN</button>
                        </div>
                        <div id="p2Card" class="bg-slate-800/50 p-4 rounded-lg border border-slate-700/50 transition-all">
                            <label class="block text-xs uppercase text-amber-400 font-bold mb-1">P2 (Đã pick 3 thẻ)</label>
                            <input type="text" id="p2Name" required placeholder="Tên Người chơi 2" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-amber-500 mb-3">
                            <div id="p2PickedTags" class="flex flex-wrap gap-1 mb-4 text-xs text-amber-300"></div>
                            <button type="button" onclick="setWinner('p2')" id="btnWinP2" class="w-full py-2 bg-slate-800 hover:bg-amber-600 text-slate-300 font-bold rounded border border-slate-700 text-sm transition shadow">P2 WIN</button>
                        </div>
                    </div>
                    <input type="hidden" id="selectedWinner" value="">
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-2.5 px-4 rounded-lg transition duration-200 shadow-lg">Lưu Trận Đấu</button>
                </form>
            </section>
        </div>

        <div id="viewRankings" class="hidden space-y-6">
            <section class="bg-slate-900 border border-slate-800 rounded-xl p-4 sm:p-6 shadow-xl">
                <h3 id="formProtocolTitle" class="text-lg font-bold text-amber-400 mb-3 border-b border-slate-800 pb-2">🧩 Thêm / Chỉnh sửa Protocol</h3>
                <form id="protocolForm" class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4 bg-slate-800/40 p-3 rounded-lg">
                    <input type="hidden" id="editProtocolIndex" value="-1">
                    <input type="text" id="newProtoName" placeholder="Tên Protocol" required class="bg-slate-800 border border-slate-700 rounded p-2 text-sm text-white">
                    <input type="text" id="newProtoImg" placeholder="Link ảnh" class="bg-slate-800 border border-slate-700 rounded p-2 text-sm text-white">
                    <input type="text" id="newProtoKeywords" placeholder="Từ khóa" required class="bg-slate-800 border border-slate-700 rounded p-2 text-sm text-white">
                    <div class="sm:col-span-3 flex gap-2">
                        <button type="submit" id="btnSubmitProto" class="flex-1 bg-amber-600 hover:bg-amber-500 font-bold py-2 rounded text-sm transition">Thêm Protocol</button>
                        <button type="button" id="btnCancelEdit" onclick="resetProtocolForm()" class="hidden px-4 bg-slate-700 hover:bg-slate-600 font-bold rounded text-sm transition">Hủy</button>
                    </div>
                </form>
                <div id="protocolInventory" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3"></div>
            </section>
            <section class="bg-slate-900 border border-slate-800 rounded-xl p-4 sm:p-6 shadow-xl">
                <h3 class="text-lg font-bold text-emerald-400 mb-3 border-b border-slate-800 pb-2">👥 Player Inventory</h3>
                <div id="playerInventoryList" class="space-y-3"></div>
            </section>
        </div>

        <div id="viewHistory" class="hidden space-y-4">
            <section class="bg-slate-900 border border-slate-800 rounded-xl p-4 sm:p-6 shadow-xl">
                <h3 class="text-lg font-bold text-sky-400 mb-3 border-b border-slate-800 pb-2">📜 Match History</h3>
                <div id="matchHistoryList" class="overflow-x-auto"></div>
            </section>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxSETLNJdUKvWBHsNKx2DaEQnetxnEToQBg2JAFqmDRfWBQuK6dRBn1oFN34VxqiHF-/exec";
        let protocols = JSON.parse(localStorage.getItem('compile_protocols')) || [
            { name: "Chaos", img: "", keywords: "Random, Shift" }, { name: "Clarity", img: "", keywords: "Reveal, Draw" },
            { name: "Corruption", img: "", keywords: "Delete, Discard" }, { name: "Courage", img: "", keywords: "Value, Boost" },
            { name: "Fear", img: "", keywords: "Cover, Lock" }, { name: "Ice", img: "", keywords: "Freeze, Control" },
            { name: "Mirror", img: "", keywords: "Copy, Swap" }, { name: "Peace", img: "", keywords: "Heal, Protect" },
            { name: "Time", img: "", keywords: "Discard, Trash" }, { name: "War", img: "", keywords: "Attack, Destroy" },
            { name: "Darkness", img: "", keywords: "Hidden, Cover" }, { name: "Light", img: "", keywords: "Reveal, Uncover" },
            { name: "Life", img: "", keywords: "Flip, Top Deck Play, Draw" }
        ];
        let matches = JSON.parse(localStorage.getItem('compile_matches')) || [];
        let currentStage = 'ban';
        let bannedProtocols = [];
        let p1Picked = [];
        let p2Picked = [];

        async function syncDataFromCloud() {
            try {
                let response = await fetch(API_URL);
                let data = await response.json();
                if (data && data.protocols && data.matches) {
                    protocols = data.protocols;
                    matches = data.matches;
                    saveDataToCloud();
                    renderProtocolGrid();
                    alert("Đã đồng bộ từ Cloud!");
                }
            } catch (e) { alert("Lỗi kết nối Cloud."); }
        }

        async function saveDataToCloud() {
            localStorage.setItem('compile_protocols', JSON.stringify(protocols));
            localStorage.setItem('compile_matches', JSON.stringify(matches));
            try {
                await fetch(API_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ protocols: protocols, matches: matches }) });
            } catch (e) { console.log("Lưu Cloud fail"); }
        }

        function toggleBanMode() {
            currentStage = document.getElementById('enableBan').checked ? 'ban' : 'pick';
            bannedProtocols = [];
            p1Picked = [];
            p2Picked = [];
            renderProtocolGrid();
        }

        function renderProtocolGrid() {
            const grid = document.getElementById('protocolCardGrid');
            const sorted = [...protocols].sort((a,b) => a.name.localeCompare(b.name));
            grid.innerHTML = sorted.map(p => {
                const isBanned = bannedProtocols.includes(p.name);
                const isP1 = p1Picked.includes(p.name);
                const isP2 = p2Picked.includes(p.name);
                let cls = isBanned ? "opacity-30 grayscale border-red-900" : (isP1 ? "border-emerald-500 ring-2 ring-emerald-500" : (isP2 ? "border-amber-500 ring-2 ring-amber-500" : "border-slate-800"));
                return `<div onclick="handleCardClick('${p.name}')" class="relative h-24 rounded-lg border-2 ${cls} flex flex-col items-center justify-center cursor-pointer p-2 bg-slate-900">
                    <h4 class="font-bold text-xs uppercase">${p.name}</h4>
                    <p class="text-[10px] text-slate-400 italic">${p.keywords}</p>
                </div>`;
            }).join('');
            document.getElementById('pickStageTitle').textContent = currentStage === 'ban' ? `PHASE 1: BAN (${bannedProtocols.length})` : `PHASE 2: PICK (P1:${p1Picked.length}/3 P2:${p2Picked.length}/3)`;
            document.getElementById('btnConfirmPick').disabled = (currentStage === 'pick' && (p1Picked.length < 3 || p2Picked.length < 3));
        }

        function handleCardClick(name) {
            if (currentStage === 'ban') {
                bannedProtocols.includes(name) ? bannedProtocols = bannedProtocols.filter(b => b !== name) : bannedProtocols.push(name);
            } else {
                if (bannedProtocols.includes(name)) return;
                if (p1Picked.includes(name)) { p1Picked = p1Picked.filter(x => x !== name); p2Picked.push(name); }
                else if (p2Picked.includes(name)) { p2Picked = p2Picked.filter(x => x !== name); }
                else if (p1Picked.length < 3) p1Picked.push(name);
                else if (p2Picked.length < 3) p2Picked.push(name);
            }
            renderProtocolGrid();
        }

        function confirmProtocolStage() {
            if (currentStage === 'ban') { currentStage = 'pick'; renderProtocolGrid(); }
            else {
                document.getElementById('protocolCardGrid').classList.add('hidden');
                document.getElementById('btnConfirmPick').classList.add('hidden');
                document.getElementById('matchForm').classList.remove('hidden');
                document.getElementById('p1PickedTags').innerHTML = p1Picked.map(x => `<span class="bg-emerald-900 px-2 rounded">${x}</span>`).join(' ');
                document.getElementById('p2PickedTags').innerHTML = p2Picked.map(x => `<span class="bg-amber-900 px-2 rounded">${x}</span>`).join(' ');
            }
        }

        function setWinner(player) {
            document.getElementById('selectedWinner').value = player;
            document.querySelectorAll('#btnWinP1, #btnWinP2').forEach(btn => btn.textContent = btn.textContent.replace(" (ĐÃ CHỌN)", ""));
            document.getElementById(player === 'p1' ? 'btnWinP1' : 'btnWinP2').textContent += " (ĐÃ CHỌN)";
        }

        document.getElementById('matchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            matches.push({ id: Date.now(), p1Name: document.getElementById('p1Name').value, p1Protocols: p1Picked, p2Name: document.getElementById('p2Name').value, p2Protocols: p2Picked, winner: document.getElementById('selectedWinner').value });
            saveDataToCloud();
            alert("Đã lưu!");
            // RESET TOÀN BỘ VỀ BƯỚC ĐẦU
            document.getElementById('matchForm').classList.add('hidden');
            document.getElementById('protocolCardGrid').classList.remove('hidden');
            document.getElementById('btnConfirmPick').classList.remove('hidden');
            document.getElementById('enableBan').checked = false;
            toggleBanMode();
            matchForm.reset();
        });

        function switchView(view) {
            document.getElementById('viewMain').classList.toggle('hidden', view !== 'main');
            document.getElementById('viewRankings').classList.toggle('hidden', view !== 'rankings');
            document.getElementById('viewHistory').classList.toggle('hidden', view !== 'history');
        }

        renderProtocolGrid();
    </script>
</body>
</html>
